# PostgreSQL Configuration (override with env vars; do not commit real passwords)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nexatalentos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=NexaTalentOSSecretKeyForJWTTokenGenerationAndValidation2024!@#
app.jwt.expiration=86400000


# H2 (disabled in prod)
spring.h2.console.enabled=false

# Logging
logging.level.com.company.nexus=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
